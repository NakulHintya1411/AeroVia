name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aerovia
          POSTGRES_PASSWORD: aerovia
          POSTGRES_DB: aerovia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerovia"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check every module compiles
        run: python -m compileall -q config db economics ingestion services dashboard migrations

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://aerovia:aerovia@localhost:5432/aerovia_test' || '' }}
        run: pytest -q
