# Render Blueprint for a STAGING deployment: the Streamlit app, the webhook API,
# and Postgres, all on Render's free plan (nothing here is billed).
#
#   In Render: New → Blueprint → pick this repo → fill in the values marked
#   `sync: false` (Razorpay test keys and plan IDs; ANTHROPIC_API_KEY is optional).
#
# Free-plan limits worth knowing (render.com/docs/free):
#   * Web services sleep after 15 min without traffic; the next request (or a
#     webhook) wakes them in about a minute.
#   * The free Postgres database EXPIRES 30 days after creation (14-day grace to
#     upgrade, then it is deleted). Upgrade it before relying on staging data.
#
# Sign-up is closed (AEROVIA_ALLOW_SIGNUP=false): the first account you create
# becomes the owner; nobody else can register until you open it.
#
# After the first deploy, add a Razorpay webhook (test mode) pointing at
#   https://<aerovia-api-staging host>/webhooks/razorpay
# using the RAZORPAY_WEBHOOK_SECRET value Render generated for the API service.
# See README → Billing.

services:
  - type: web
    name: aerovia-staging
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /_stcore/health
    envVars:
      - key: AEROVIA_SERVICE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: aerovia-staging-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AEROVIA_ENV
        value: staging
      - key: AEROVIA_ALLOW_SIGNUP
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: RAZORPAY_PLAN_TEAM
        sync: false

  - type: web
    name: aerovia-api-staging
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: AEROVIA_SERVICE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: aerovia-staging-db
          property: connectionString
      - key: AEROVIA_ENV
        value: staging
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: RAZORPAY_PLAN_TEAM
        sync: false
      # Random secret generated by Render; copy it into the Razorpay webhook settings.
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: aerovia-staging-db
    plan: free
    region: singapore
    databaseName: aerovia
